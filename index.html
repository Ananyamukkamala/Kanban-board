<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
  
    <style>
      /* write your CSS here  */
       *{
            box-sizing: border-box;
            margin:0;
            padding:0;
        }
        .toolbox-cont{
            height:5rem;
            background-color:rgb(78, 75, 75);
            display:flex;
            align-items:center; 
            justify-content: center;
        }
        .toolbox-cont > * {
            margin-left:4rem;
        }
        .toolbox-priority-cont{
            height:3.5rem;
            width:18rem;
            background-color:grey;
            display:flex;
            align-items:center;
            justify-content: space-evenly;
        }
        .toolbox-priority-cont > *:hover{
            background-color:rgb(118, 167, 118);
        }
        .color{
            height:1.5rem;
            width:3rem;
        }
        .lightpink{
            background-color:lightpink;
        }
        .lightblue{
            background-color:lightblue;
        }
        .lightgreen{
            background-color:lightgreen;
        }
        .black{
            background-color:black;
        }
        .action-btn-cont{
            height:3.5rem;
            width:8rem;
            background-color:grey;
            display:flex;
            
        }
        .action-btn-cont > *{
            display:flex;
            width:50%;
            font-size:2rem;
            color:white;
            justify-content: center;
            align-items:center;
        }
        .add-btn:hover , .remove-btn:hover{
            background-color: greenyellow;

        }
        .main-cont{
            display:flex;
            flex-wrap:wrap;
            justify-content:space-evenly;
            align-items:center;
            padding:2rem;
        }
        .ticket-cont{
            height:12rem;
            width:15rem;
            background-color:rgb(80, 208, 255);
            /* padding:0.8rem; */
            position: relative;
        }
        .ticket-color{
            height:1rem;  
        }
        .ticket-id{
            background-color: yellow;
        }
        .ticket-lock{
            position:absolute;
            bottom:5px;
            right:2px;
            font-size:1.5rem;
        } 
        .modal-cont{
            display:none;
            height:50vh;
            width:45vw;
            background-color: rgb(62, 58, 58);
            position:absolute;
            top:30%;
            left:25%;
        }
        .show{
            display:flex;
        }
        .textArea-cont{
            height: 1005;;
            width:75%;
            resize: none;
            outline:none;
            border:none;
            background-color: aliceblue;
            font-size:2rem;
            color:black;
            padding:1rem;
        }
       .priority-colors-cont{
        height:100%;
        width:25%;
        display:flex;
        flex-direction:column;
        align-items:center; 
        justify-content:space-evenly;
       } 
       .priority-color{
        /* margin:1rem; */
        height:3rem;
        width:5rem;
       }
       .active{
        border:5px solid lightsalmon;

       }
    </style>
</head>
<body>
    <div class="toolbox-cont">
        <div class="toolbox-priority-cont">
          <div class="lightpink color"></div>  
          <div class="lightgreen color"></div>  
          <div class="lightblue color"></div> 
          <div class="black color"></div>  
        </div>
        <div class="action-btn-cont">
            <div class="add-btn">
                <i class="fa-solid fa-plus"></i>
            </div>
            <div class="remove-btn">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
    </div>
    <div class="main-cont">
        <!-- <div class="ticket-cont">
            <div class="ticket-color"></div>
            <div class="ticket-id">1234</div>
            <div class="task-area">Random Task</div>
            <div class="ticket-lock">
                <i class="fa-solid fa-lock"></i>
            </div>
        </div> -->
    </div>
    <div class="modal-cont">
        <textarea class="textArea-cont" placeholder="Enter your Task"></textarea>
        <div class="priority-colors-cont">
            <div class="lightpink priority-color"></div>
            <div class="lightblue priority-color"></div>
            <div class="lightgreen priority-color"></div>
            <div class="black priority-color active"></div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/b8e027b0fd.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/shortid-dist@1.0.5/dist/shortid-2.2.13.min.js"></script>
    <script src="script.js"></script>
    
    
</body>
</html>
